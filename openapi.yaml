openapi: 3.1.0
info:
  title: PetPOC API
  version: 0.1.0
  description: |
    REST API for the PetPOC Next.js application.

    Protected endpoints require a Clerk session token in the Authorization
    header using the Bearer scheme.
  contact:
    name: PetPOC API Maintainers
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://petpoc-dev.vercel.app
    description: DEV
security:
  - ClerkBearerAuth: []
tags:
  - name: Echo
    description: Clerk-authenticated identity echo endpoints.
  - name: Users
    description: User registration and user lookup endpoints backed by the users table.
  - name: Notes
    description: Authenticated user notes backed by the notes table.
  - name: Payment Methods
    description: Stripe-backed credit card management endpoints.
paths:
  /api/v1/echo:
    get:
      operationId: getEcho
      tags:
        - Echo
      summary: Echo the authenticated Clerk identity.
      description: |
        Validates the Clerk session token, resolves the authenticated user's
        display name and email, upserts the user into the database, and returns
        the echoed identity.
      parameters:
        - $ref: "#/components/parameters/EchoName"
        - $ref: "#/components/parameters/EchoEmail"
      responses:
        "200":
          description: Authenticated identity echoed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EchoResponse"
              examples:
                success:
                  value:
                    name: James Zhou
                    email: james@example.com
                    userId: user_2abc123xyz
                    tokenSource: clerk
        "400":
          $ref: "#/components/responses/InvalidEchoQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notes:
    get:
      operationId: listNotes
      tags:
        - Notes
      summary: List notes for the authenticated user.
      description: |
        Resolves the authenticated Clerk user to the corresponding `users`
        table row and returns notes belonging to that database user.
      responses:
        "200":
          description: Notes found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesResponse"
              examples:
                success:
                  value:
                    notes:
                      - id: 89ccfdb7-c1ea-4e31-a2cf-b7018fab31ad
                        userId: 7dc4e84a-9abc-4f01-bf61-669b747fb1b8
                        message: Remember favorite food
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createNote
      tags:
        - Notes
      summary: Create a note for the authenticated user.
      description: |
        Validates the Clerk session token, resolves the user in the `users`
        table, and stores the note message in the `notes` table with that
        database user ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
            examples:
              message:
                value:
                  message: Remember favorite food
      responses:
        "201":
          description: Note created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
              examples:
                success:
                  value:
                    id: 89ccfdb7-c1ea-4e31-a2cf-b7018fab31ad
                    userId: 7dc4e84a-9abc-4f01-bf61-669b747fb1b8
                    message: Remember favorite food
        "400":
          $ref: "#/components/responses/InvalidNoteBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/payment-methods:
    get:
      operationId: listPaymentMethods
      tags:
        - Payment Methods
      summary: List saved credit cards for the authenticated user.
      description: |
        Resolves the authenticated Clerk user to the corresponding database
        user, then uses `users.stripe_customer_id` to list card payment methods
        from Stripe. If no Stripe customer exists yet, returns an empty list.
      responses:
        "200":
          description: Payment methods found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodsResponse"
              examples:
                success:
                  value:
                    paymentMethods:
                      - id: pm_123
                        brand: visa
                        last4: "4242"
                        expMonth: 12
                        expYear: 2030
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/payment-methods/setup-intent:
    post:
      operationId: createPaymentMethodSetupIntent
      tags:
        - Payment Methods
      summary: Create a Stripe SetupIntent for adding a card.
      description: |
        Creates a Stripe customer for the authenticated user when
        `users.stripe_customer_id` is missing, stores the customer ID in the
        users table, and returns a SetupIntent client secret for Stripe.js.
      responses:
        "201":
          description: SetupIntent created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupIntentResponse"
              examples:
                success:
                  value:
                    clientSecret: seti_123_secret_abc
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/payment-methods/{payment_method_id}:
    delete:
      operationId: deletePaymentMethod
      tags:
        - Payment Methods
      summary: Remove a saved credit card.
      description: |
        Retrieves the Stripe payment method, verifies it belongs to the
        authenticated user's Stripe customer, and detaches it in Stripe.
      parameters:
        - $ref: "#/components/parameters/PaymentMethodId"
      responses:
        "204":
          description: Payment method removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PaymentMethodNotFound"
  /api/v1/users/register:
    post:
      operationId: registerUser
      tags:
        - Users
      summary: Register or update the authenticated user.
      description: |
        Idempotently inserts or updates the authenticated Clerk user in the
        `users` table. The Clerk user ID from the session token is stored in
        `auth_user_id`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
            examples:
              withName:
                value:
                  name: James Zhou
              empty:
                value: {}
      responses:
        "201":
          description: User registered or updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                success:
                  value:
                    id: 7dc4e84a-9abc-4f01-bf61-669b747fb1b8
                    auth_user_id: user_2abc123xyz
                    name: James Zhou
                    stripe_customer_id: cus_123
        "400":
          $ref: "#/components/responses/InvalidRegisterUserBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/{clerk_user_id}:
    get:
      operationId: getUserByClerkUserId
      tags:
        - Users
      summary: Get the authenticated user's database record.
      description: |
        Looks up a user in the `users` table by `auth_user_id`. The
        `{clerk_user_id}` path parameter must match the user ID from the Clerk
        session token.
      parameters:
        - $ref: "#/components/parameters/ClerkUserId"
      responses:
        "200":
          description: User found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                success:
                  value:
                    id: 7dc4e84a-9abc-4f01-bf61-669b747fb1b8
                    auth_user_id: user_2abc123xyz
                    name: James Zhou
                    stripe_customer_id: cus_123
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
components:
  securitySchemes:
    ClerkBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
      description: "Clerk session JWT sent as `Authorization: Bearer <token>`."
  parameters:
    EchoName:
      name: name
      in: query
      required: false
      description: Optional fallback display name supplied by the frontend.
      schema:
        type: string
        minLength: 1
      example: James Zhou
    EchoEmail:
      name: email
      in: query
      required: false
      description: Optional fallback email supplied by the frontend.
      schema:
        type: string
        format: email
      example: james@example.com
    ClerkUserId:
      name: clerk_user_id
      in: path
      required: true
      description: Clerk user ID. Must match the authenticated token subject.
      schema:
        type: string
        minLength: 1
      example: user_2abc123xyz
    PaymentMethodId:
      name: payment_method_id
      in: path
      required: true
      description: Stripe payment method ID.
      schema:
        type: string
        minLength: 1
      example: pm_123
  schemas:
    EchoResponse:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - userId
        - tokenSource
      properties:
        name:
          type: string
          example: James Zhou
        email:
          oneOf:
            - type: string
              format: email
            - type: string
              const: unknown@example.invalid
          example: james@example.com
        userId:
          type: string
          description: Clerk user ID.
          example: user_2abc123xyz
        tokenSource:
          type: string
          const: clerk
    RegisterUserRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Optional display name. If omitted, the API falls back to Clerk profile data.
          example: James Zhou
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - auth_user_id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Database user ID.
          example: 7dc4e84a-9abc-4f01-bf61-669b747fb1b8
        auth_user_id:
          type: string
          description: Clerk user ID stored in the users.auth_user_id column.
          example: user_2abc123xyz
        name:
          type: string
          example: James Zhou
        stripe_customer_id:
          type:
            - string
            - "null"
          description: Stripe customer ID for saved payment methods.
          example: cus_123
    CreateNoteRequest:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          example: Remember favorite food
    Note:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - message
      properties:
        id:
          type: string
          format: uuid
          description: Database note ID.
          example: 89ccfdb7-c1ea-4e31-a2cf-b7018fab31ad
        userId:
          type: string
          format: uuid
          description: Database user ID stored in the notes.user_id column.
          example: 7dc4e84a-9abc-4f01-bf61-669b747fb1b8
        message:
          type: string
          example: Remember favorite food
    NotesResponse:
      type: object
      additionalProperties: false
      required:
        - notes
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"
    SetupIntentResponse:
      type: object
      additionalProperties: false
      required:
        - clientSecret
      properties:
        clientSecret:
          type: string
          description: Stripe SetupIntent client secret.
          example: seti_123_secret_abc
    PaymentMethod:
      type: object
      additionalProperties: false
      required:
        - id
        - brand
        - last4
        - expMonth
        - expYear
      properties:
        id:
          type: string
          description: Stripe payment method ID.
          example: pm_123
        brand:
          type: string
          example: visa
        last4:
          type: string
          example: "4242"
        expMonth:
          type: integer
          example: 12
        expYear:
          type: integer
          example: 2030
    PaymentMethodsResponse:
      type: object
      additionalProperties: false
      required:
        - paymentMethods
      properties:
        paymentMethods:
          type: array
          items:
            $ref: "#/components/schemas/PaymentMethod"
    ErrorResponse:
      type: object
      additionalProperties: true
      required:
        - error
      properties:
        error:
          type: string
          example: Unauthorized
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
  responses:
    Unauthorized:
      description: Missing, invalid, or expired Clerk session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value:
                error: Unauthorized
    Forbidden:
      description: The authenticated user cannot access the requested resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbidden:
              value:
                error: Forbidden
    UserNotFound:
      description: No matching user row exists in the database.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              value:
                error: User not found
    PaymentMethodNotFound:
      description: No matching payment method exists for the authenticated user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              value:
                error: Payment method not found
    InvalidEchoQuery:
      description: Invalid echo query parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          examples:
            invalidEmail:
              value:
                error: Invalid echo query
                details:
                  email:
                    - Invalid email
    InvalidRegisterUserBody:
      description: Invalid register user request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          examples:
            emptyName:
              value:
                error: Invalid register user body
                details:
                  name:
                    - String must contain at least 1 character(s)
    InvalidNoteBody:
      description: Invalid note request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          examples:
            emptyMessage:
              value:
                error: Invalid note body
                details:
                  message:
                    - String must contain at least 1 character(s)
